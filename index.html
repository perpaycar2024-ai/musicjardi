<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>MusicJardi 🎵</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #0f0f1a;
            --surface:   #1a1a2e;
            --surface2:  #22223a;
            --border:    rgba(255,255,255,0.07);
            --gold:      #c9a84c;
            --gold-dim:  rgba(201,168,76,0.15);
            --gold-glow: rgba(201,168,76,0.35);
            --green:     #4caf6e;
            --green-dim: rgba(76,175,110,0.12);
            --text:      #e8e4da;
            --text-muted:#8a8580;
            --red:       #e07070;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Fondo con textura sutil */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201,168,76,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(76,175,110,0.06) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            width: 100%;
            padding: 2rem 1rem 1.6rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .header-inner {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .header-icon {
            font-size: 2rem;
            line-height: 1;
            filter: drop-shadow(0 0 12px var(--gold-glow));
            animation: pulse-icon 3s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%, 100% { filter: drop-shadow(0 0 10px var(--gold-glow)); }
            50%       { filter: drop-shadow(0 0 22px rgba(201,168,76,0.6)); }
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--gold);
            line-height: 1;
        }

        header p {
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 300;
        }

        /* Línea decorativa */
        .header-rule {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 10px auto 0;
        }

        main {
            width: 95%;
            max-width: 580px;
            padding: 0 0 40px;
            position: relative;
            z-index: 1;
        }

        /* Buscador */
        .search-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .search-wrap::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0.5;
        }

        .search-box {
            width: 100%;
            padding: 13px 16px 13px 42px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box::placeholder { color: var(--text-muted); }

        .search-box:focus {
            border-color: rgba(201,168,76,0.4);
            box-shadow: 0 0 0 3px var(--gold-dim);
        }

        /* Card de añadir */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 0.82rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .field-wrap {
            position: relative;
        }

        .field-label {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 5px;
            display: block;
        }

        /* File input custom */
        .file-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 11px 16px;
            background: var(--surface2);
            border: 1px dashed rgba(201,168,76,0.3);
            border-radius: 10px;
            color: var(--text-muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .file-btn:hover {
            border-color: var(--gold);
            background: var(--gold-dim);
            color: var(--text);
        }

        input[type="file"]#audioInput { display: none; }

        input[type="text"] {
            width: 100%;
            padding: 11px 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder { color: var(--text-muted); }

        input[type="text"]:focus {
            border-color: rgba(201,168,76,0.4);
            box-shadow: 0 0 0 3px var(--gold-dim);
        }

        .btn-main {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #c9a84c, #a8863a);
            color: #0f0f1a;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(201,168,76,0.25);
        }

        .btn-main:hover {
            opacity: 0.92;
            box-shadow: 0 6px 20px rgba(201,168,76,0.4);
        }

        .btn-main:active { transform: scale(0.98); }

        /* Footer controles */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .continuous-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        /* Toggle switch */
        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
        }

        .toggle input { display: none; }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: background 0.2s, border-color 0.2s;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 12px;
            height: 12px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: transform 0.2s, background 0.2s;
        }

        .toggle input:checked ~ .toggle-track {
            background: var(--green-dim);
            border-color: var(--green);
        }

        .toggle input:checked ~ .toggle-thumb {
            transform: translateX(16px);
            background: var(--green);
        }

        .btn-group { display: flex; gap: 6px; }

        .btn-outline {
            padding: 7px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }

        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: var(--gold-dim);
        }

        /* Carpetas */
        #gardenDisplay { display: flex; flex-direction: column; gap: 10px; }

        .folder-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .folder-container:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .folder-header {
            padding: 14px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface2);
            transition: background 0.15s;
        }

        .folder-header:hover { background: rgba(255,255,255,0.04); }

        .folder-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .folder-icon {
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .folder-container.open .folder-icon { transform: rotate(0deg); }

        .folder-name {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: var(--gold);
            font-weight: 700;
        }

        .folder-count {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px 8px;
        }

        .folder-chevron {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-right: 8px;
            transition: transform 0.25s;
        }

        .folder-container.open .folder-chevron { transform: rotate(90deg); }

        .rename-folder-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 4px 6px;
            border-radius: 6px;
            color: var(--text-muted);
            transition: background 0.15s, color 0.15s;
        }

        .rename-folder-btn:hover { background: var(--gold-dim); color: var(--gold); }

        .folder-content { display: none; padding: 6px 12px 10px; }
        .folder-container.open .folder-content { display: block; }

        /* Ítems de audio */
        .audio-item {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
        }

        .audio-item:last-child { border-bottom: none; }

        .audio-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .audio-name {
            font-size: 0.85rem;
            color: var(--text);
            font-weight: 500;
            max-width: 70%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .audio-actions { display: flex; gap: 5px; }

        .action-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.72rem;
            padding: 4px 8px;
            color: var(--text-muted);
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .action-btn:hover { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
        .action-btn.del:hover { background: rgba(224,112,112,0.12); border-color: var(--red); color: var(--red); }

        /* Audio player estilizado */
        audio {
            width: 100%;
            height: 32px;
            border-radius: 8px;
            accent-color: var(--gold);
            filter: invert(0);
        }

        /* Webkit custom audio (limitado pero algo hace) */
        audio::-webkit-media-controls-panel {
            background: var(--surface2);
        }

        .hidden { display: none; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 0.85rem;
            line-height: 1.6;
        }

        /* Animación entrada carpetas */
        .folder-container {
            animation: slide-in 0.25s ease both;
        }

        @keyframes slide-in {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* Nombre de archivo seleccionado */
        #file-label {
            font-size: 0.8rem;
            color: var(--green);
            margin-top: 4px;
            display: block;
            min-height: 16px;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="header-icon">🎵</div>
        <h1>MusicJardi</h1>
        <p>Tu jardín sonoro</p>
        <div class="header-rule"></div>
    </div>
</header>

<main>
    <div class="search-wrap">
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar canción o carpeta…" oninput="renderGarden()">
    </div>

    <section class="card">
        <p class="card-title">Añadir audio</p>
        <div class="input-row">
            <div class="field-wrap">
                <label class="field-label">Archivo</label>
                <label class="file-btn" for="audioInput">
                    <span>📂</span>
                    <span id="file-btn-text">Seleccionar archivo de audio…</span>
                </label>
                <input type="file" id="audioInput" accept="audio/*" onchange="updateFileLabel(this)">
                <span id="file-label"></span>
            </div>
            <div class="field-wrap">
                <label class="field-label" for="folderInput">Carpeta</label>
                <input type="text" id="folderInput" placeholder="Ej: Podcast, Relajación…">
            </div>
            <button class="btn-main" onclick="saveAudio()">＋ Plantar audio</button>
        </div>

        <div class="card-footer">
            <label class="continuous-label" for="continuousPlay">
                <span class="toggle">
                    <input type="checkbox" id="continuousPlay">
                    <span class="toggle-track"></span>
                    <span class="toggle-thumb"></span>
                </span>
                Reproducción continua
            </label>
            <div class="btn-group">
                <button class="btn-outline" onclick="exportBackup()">↑ Backup</button>
                <button class="btn-outline" onclick="document.getElementById('restoreInput').click()">↓ Restore</button>
            </div>
        </div>
        <input type="file" id="restoreInput" class="hidden" accept=".json" onchange="importBackup(this)">
    </section>

    <div id="gardenDisplay"></div>
</main>

<script>
    const dbName = "MusicJardiFinalDB";
    let db;

    // Muestra nombre del archivo seleccionado
    function updateFileLabel(input) {
        const label = document.getElementById('file-label');
        const btn   = document.getElementById('file-btn-text');
        if (input.files[0]) {
            label.textContent = '✓ ' + input.files[0].name;
            btn.textContent = 'Cambiar archivo…';
        }
    }

    // Inicialización DB
    const request = indexedDB.open(dbName, 1);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        db.createObjectStore("audios", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = (e) => {
        db = e.target.result;
        renderGarden();
    };

    // Guardar
    function saveAudio() {
        const file   = document.getElementById('audioInput').files[0];
        const folder = document.getElementById('folderInput').value.trim() || "General";
        if (!file) return alert("Selecciona un audio");

        const reader = new FileReader();
        reader.onload = (e) => {
            const tx = db.transaction(["audios"], "readwrite");
            tx.objectStore("audios").add({
                name: file.name,
                folder: folder,
                data: e.target.result,
                lastPosition: 0
            });
            tx.oncomplete = () => {
                document.getElementById('audioInput').value = "";
                document.getElementById('file-label').textContent = "";
                document.getElementById('file-btn-text').textContent = "Seleccionar archivo de audio…";
                renderGarden();
            };
        };
        reader.readAsArrayBuffer(file);
    }

    // Renderizado con Buscador
    function renderGarden() {
        const display = document.getElementById('gardenDisplay');
        const term    = document.getElementById('searchInput').value.toLowerCase();
        display.innerHTML = "";

        const store   = db.transaction("audios").objectStore("audios");
        const folders = {};

        store.openCursor().onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) {
                const item = cursor.value;
                if (item.name.toLowerCase().includes(term) || item.folder.toLowerCase().includes(term)) {
                    if (!folders[item.folder]) folders[item.folder] = [];
                    folders[item.folder].push(item);
                }
                cursor.continue();
            } else {
                if (Object.keys(folders).length === 0) {
                    display.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🌱</div>
                            <p>Tu jardín está vacío.<br>Añade tu primer audio arriba.</p>
                        </div>`;
                    return;
                }
                Object.keys(folders).sort().forEach(fName => {
                    createFolderUI(fName, folders[fName], display, term !== "");
                });
            }
        };
    }

    function createFolderUI(name, audios, container, forceOpen) {
        const folderDiv = document.createElement('div');
        folderDiv.className = `folder-container ${forceOpen ? 'open' : ''}`;

        folderDiv.innerHTML = `
            <div class="folder-header">
                <div class="folder-title-wrap" onclick="this.closest('.folder-container').classList.toggle('open')">
                    <span class="folder-chevron">▶</span>
                    <span class="folder-icon">📁</span>
                    <span class="folder-name">${name}</span>
                    <span class="folder-count">${audios.length}</span>
                </div>
                <button class="rename-folder-btn" onclick="renameFolder('${name}')">✏️</button>
            </div>
            <div class="folder-content"></div>
        `;

        const content = folderDiv.querySelector('.folder-content');
        audios.forEach(audio => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'audio-item';
            const url = URL.createObjectURL(new Blob([audio.data]));

            itemDiv.innerHTML = `
                <div class="audio-info">
                    <span class="audio-name" title="${audio.name}">${audio.name}</span>
                    <div class="audio-actions">
                        <button class="action-btn" onclick="renameAudio(${audio.id}, '${audio.name.replace(/'/g,"\\'")}')">✏️</button>
                        <button class="action-btn del" onclick="deleteItem(${audio.id})">🗑️</button>
                    </div>
                </div>
                <audio id="audio-${audio.id}" controls src="${url}#t=${audio.lastPosition || 0}"></audio>
            `;
            content.appendChild(itemDiv);

            setTimeout(() => {
                const p = document.getElementById(`audio-${audio.id}`);
                p.onpause = () => updateRecord(audio.id, { lastPosition: p.currentTime });
                p.onended = () => {
                    updateRecord(audio.id, { lastPosition: 0 });
                    if (document.getElementById('continuousPlay').checked) {
                        const next = itemDiv.nextElementSibling?.querySelector('audio');
                        if (next) next.play();
                    }
                };
            }, 50);
        });
        container.appendChild(folderDiv);
    }

    // Funciones Auxiliares (Update, Rename, Delete)
    function updateRecord(id, updates) {
        const tx    = db.transaction(["audios"], "readwrite");
        const store = tx.objectStore("audios");
        store.get(id).onsuccess = (e) => {
            const data = e.target.result;
            if (data) { Object.assign(data, updates); store.put(data); }
        };
    }

    function renameAudio(id, oldName) {
        const n = prompt("Nuevo nombre:", oldName);
        if (n) { updateRecord(id, { name: n }); setTimeout(renderGarden, 100); }
    }

    function renameFolder(old) {
        const n = prompt("Nuevo nombre carpeta:", old);
        if (!n) return;
        const tx    = db.transaction(["audios"], "readwrite");
        const store = tx.objectStore("audios");
        store.openCursor().onsuccess = (e) => {
            const c = e.target.result;
            if (c) {
                if (c.value.folder === old) { const d = c.value; d.folder = n; c.update(d); }
                c.continue();
            } else { renderGarden(); }
        };
    }

    function deleteItem(id) {
        if (confirm("¿Eliminar este audio?")) {
            const tx = db.transaction(["audios"], "readwrite");
            tx.objectStore("audios").delete(id);
            tx.oncomplete = () => renderGarden();
        }
    }

    // Backup & Restore
    async function exportBackup() {
        const store = db.transaction("audios").objectStore("audios");
        const all   = [];
        store.openCursor().onsuccess = (e) => {
            const c = e.target.result;
            if (c) {
                const bytes  = new Uint8Array(c.value.data);
                let binary   = '';
                for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                all.push({...c.value, data: btoa(binary)});
                c.continue();
            } else {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([JSON.stringify(all)], {type:"application/json"}));
                a.download = "musicjardi_backup.json";
                a.click();
            }
        };
    }

    function importBackup(input) {
        const f = input.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (e) => {
            const data = JSON.parse(e.target.result);
            const tx   = db.transaction(["audios"], "readwrite");
            const s    = tx.objectStore("audios");
            data.forEach(item => {
                const bin   = atob(item.data);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                item.data = bytes.buffer;
                delete item.id;
                s.add(item);
            });
            tx.oncomplete = () => { alert("Jardín restaurado ✓"); renderGarden(); };
        };
        r.readAsText(f);
    }
</script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/musicjardi/sw.js');
    }
</script>
</body>
</html>
